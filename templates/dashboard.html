<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentinel-AI | Security Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .stat-card { text-align: center; padding: 20px; transition: 0.3s; }
        .stat-card:hover { border-color: #58a6ff; transform: translateY(-5px); }
        .neon-text { color: #58a6ff; text-shadow: 0 0 10px #58a6ff55; }
        .badge-pii { background-color: #f85149; color: white; }
        .table { color: #8b949e; }
    </style>
</head>
<body>
    <nav class="navbar border-bottom border-secondary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 neon-text">🛡️ SENTINEL-AI</span>
            <span class="badge border border-success text-success">SYSTEM ACTIVE</span>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card stat-card">
                    <h5>Total Scanned</h5>
                    <h2 id="total-count" class="neon-text">{{ stats.total }}</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card">
                    <h5>PII Prevented</h5>
                    <h2 id="leak-count" class="text-danger">{{ stats.leaks }}</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card">
                    <h5>Anonymization Rate</h5>
                    <h2 class="text-success">100%</h2>
                </div>
            </div>
        </div>

        <div class="card p-4">
            <h5>Recent Interceptions</h5>
            <table class="table mt-3">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Detected Entities</th>
                    </tr>
                </thead>
                <tbody id="log-table">
                    {% for log in logs %}
                    <tr>
                        <td>{{ log.time }}</td>
                        <td><span class="badge bg-success">Secured</span></td>
                        <td>{{ log.entities | join(', ') }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
